name: Publish metadata to non-production (edge) environment
on:
  workflow_dispatch:
    inputs:
      full_publish:
        description: "Publish all discovery and station metadata"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "feature/**"
      - "fix/**"
    paths:
      - 'wis2-pipeline/wis2box-data/metadata/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: wis2-metadata-publish-non-production
  cancel-in-progress: false

jobs:
  publish-metadata-non-production:
    runs-on: ubuntu-latest
    environment: edge
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect changed discovery metadata files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_publish }}" = "true" ]; then
            echo "collections=" >> "$GITHUB_OUTPUT"
            echo "station_changed=false" >> "$GITHUB_OUTPUT"
            echo "Manual full publish requested; skipping changed-file detection"
            exit 0
          fi

          # Discovery metadata: Added or Modified .yml files
          CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD \
            -- 'wis2-pipeline/wis2box-data/metadata/discovery/*.yml' \
            | xargs -r -n1 basename \
            | sed 's/\.yml$//' \
            | tr '\n' ' ' \
            | xargs)
          echo "collections=${CHANGED}" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No discovery metadata collections changed"
          else
            echo "Changed discovery collections: ${CHANGED}"
          fi

          # Station metadata: any CSV change triggers a full re-publish of all
          # hardcoded station files in publish_station_metadata.sh
          STATION_CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD \
            -- 'wis2-pipeline/wis2box-data/metadata/station/*.csv')
          if [ -n "$STATION_CHANGED" ]; then
            echo "station_changed=true" >> "$GITHUB_OUTPUT"
            echo "Station metadata changed: ${STATION_CHANGED}"
          else
            echo "station_changed=false" >> "$GITHUB_OUTPUT"
            echo "Station metadata unchanged"
          fi

      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.METADATA_PUBLICATION_IAM_ROLE }}
          aws-region: ap-southeast-2

      - name: Resolve running ECS task ARN
        id: ecs
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster wis2box-edge \
            --family wis2box-edge \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ERROR: No running wis2box-edge task found" >&2
            exit 1
          fi
          echo "task_arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Update metadata files in container
        run: |
          unbuffer aws ecs execute-command \
            --region ap-southeast-2 \
            --cluster wis2box-edge \
            --task "${{ steps.ecs.outputs.task_arn }}" \
            --container wis2box-management \
            --command "sh -c 'git clone --branch ${{ github.ref_name }} --single-branch https://github.com/aodn/wis2box-aodn.git /tmp/wis2box-deploy && DEPLOY_BRANCH=${{ github.ref_name }} bash /tmp/wis2box-deploy/wis2-pipeline/wis2box-data/scripts/update_metadata.sh && rm -rf /tmp/wis2box-deploy'" \
            --interactive

      - name: Publish all discovery collections
        if: github.event_name == 'workflow_dispatch' && inputs.full_publish
        run: |
          unbuffer aws ecs execute-command \
            --region ap-southeast-2 \
            --cluster wis2box-edge \
            --task "${{ steps.ecs.outputs.task_arn }}" \
            --container wis2box-management \
            --command "sh -c 'cd /data/wis2box/scripts && INCLUDE_INTEGRATION_TEST=true ./publish_discovery_metadata.sh'" \
            --interactive

      - name: Publish changed discovery collections
        if: steps.changed.outputs.collections != '' && !(github.event_name == 'workflow_dispatch' && inputs.full_publish)
        run: |
          unbuffer aws ecs execute-command \
            --region ap-southeast-2 \
            --cluster wis2box-edge \
            --task "${{ steps.ecs.outputs.task_arn }}" \
            --container wis2box-management \
            --command "sh -c 'cd /data/wis2box/scripts && INCLUDE_INTEGRATION_TEST=true ./publish_discovery_metadata.sh ${{ steps.changed.outputs.collections }}'" \
            --interactive

      - name: Publish all station metadata
        if: github.event_name == 'workflow_dispatch' && inputs.full_publish
        run: |
          unbuffer aws ecs execute-command \
            --region ap-southeast-2 \
            --cluster wis2box-edge \
            --task "${{ steps.ecs.outputs.task_arn }}" \
            --container wis2box-management \
            --command "sh -c 'cd /data/wis2box/scripts && INCLUDE_INTEGRATION_TEST=true ./publish_station_metadata.sh'" \
            --interactive

      - name: Publish changed station metadata
        if: steps.changed.outputs.station_changed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.full_publish)
        run: |
          unbuffer aws ecs execute-command \
            --region ap-southeast-2 \
            --cluster wis2box-edge \
            --task "${{ steps.ecs.outputs.task_arn }}" \
            --container wis2box-management \
            --command "sh -c 'cd /data/wis2box/scripts && INCLUDE_INTEGRATION_TEST=true ./publish_station_metadata.sh'" \
            --interactive
