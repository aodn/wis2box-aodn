name: Deploy the metadata to ecs wis2box-management service and publish wis2 datasets metadata
on:
  push:
    branches:
      - "main"
    paths:
      - 'wis2-pipeline/wis2box-data/metadata/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: metadata-publish
  cancel-in-progress: false

jobs:
  publish-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed discovery metadata files
        id: changed
        run: |
          # Get yml files that were Added (A) or Modified (M) in this push
          CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD \
            -- 'wis2-pipeline/wis2box-data/metadata/discovery/*.yml' \
            | xargs -r -n1 basename \
            | sed 's/\.yml$//' \
            | tr '\n' ' ' \
            | xargs)  # trim trailing whitespace
          echo "files=${CHANGED}" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No discovery metadata files changed — skipping publish step"
          else
            echo "Changed discovery metadata: ${CHANGED}"
          fi

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::704910415367:role/wis2-metadata-publication
          #TODO: Granularize the permissions of this IAM role and store the role ARN in GitHub secrets.
          aws-region: ap-southeast-2

      - name: Resolve running ECS task ARN
        id: ecs
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster wis2box-edge \
            --family wis2box-management \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ERROR: No running wis2box-management task found" >&2
            exit 1
          fi
          echo "task_arn=${TASK_ARN}" >> "$GITHUB_OUTPUT"

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Update metadata files in container
        run: |
          unbuffer aws ecs execute-command \
            --region ap-southeast-2 \
            --cluster wis2box-edge \
            --task "${{ steps.ecs.outputs.task_arn }}" \
            --container wis2box-management \
            --command "sh -c 'cd /data/wis2box/scripts && ./update_metadata.sh'" \
            --interactive

      - name: Publish changed discovery metadata
        if: steps.changed.outputs.files != ''
        run: |
          COLLECTION="${{ steps.changed.outputs.files }}"
          unbuffer aws ecs execute-command \
            --region ap-southeast-2 \
            --cluster wis2box-edge \
            --task "${{ steps.ecs.outputs.task_arn }}" \
            --container wis2box-management \
            --command "sh -c 'cd /data/wis2box/scripts && ./publish_metadata.sh ${COLLECTION}'" \
            --interactive

      - name: No discovery metadata changes to publish
        if: steps.changed.outputs.files == ''
        run: echo "Only station or non-discovery metadata changed — publish step skipped."

